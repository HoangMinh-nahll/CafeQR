<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Dashboard · Cafe QR Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261117_v13">
  <script src="/js/common.js?v=20261117_v13" defer></script>
  <script src="/js/staff.js?v=20261117_v13" defer></script>
  <!-- FAVICON & APP ICONS (HIỂN THỊ LOGO TRÊN ĐƯỜNG LINK & TAB TRÌNH DUYỆT) -->
  <link rel="shortcut icon" href="/favicon.ico?v=20261117_v13">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261117_v13">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261117_v13">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261117_v13">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261117_v13">
  <meta property="og:image" content="/images/logo-banner.png?v=20261117_v13">
  <meta property="og:title" content="QR Cà Phê Tây Nguyên">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-mark">
      <img src="/images/logo.png?v=20261117_v13" alt="QR Cà Phê Tây Nguyên" class="brand-logo-img">
    </span>
    <span>QR Cà Phê Tây Nguyên<small>Staff Dashboard</small></span>
  </a>
  <div class="header-actions">
    <span id="staffName" class="muted light-text"></span>
    <button class="btn btn-outline-light" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</button>
  </div>
</header>
<main class="page-shell wide-shell">
  <div class="page-title"><div><p class="eyebrow">ORDER PROCESSING</p><h1>Quản lý đơn hàng</h1><p class="muted">Xem món, số bàn và cập nhật trạng thái phục vụ.</p></div><button id="refreshOrders" class="btn btn-primary"><i class="fa-solid fa-arrows-rotate"></i> Làm mới đơn</button></div>
  <div class="status-legend"><span><i class="status-dot new"></i> Mới</span><span><i class="status-dot confirmed"></i> Đã xác nhận</span><span><i class="status-dot preparing"></i> Đang chuẩn bị</span><span><i class="status-dot ready"></i> Sẵn sàng</span><span><i class="status-dot completed"></i> Hoàn thành</span></div>
  <div id="ordersList" class="orders-grid"><div class="loading-card">Đang tải đơn hàng...</div></div>
</main>
<footer class="site-footer">Cafe QR Ordering Website · Staff</footer>
</body>
</html>
