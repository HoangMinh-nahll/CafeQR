<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Dashboard · Cafe QR Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261115_04">
  <script src="/js/common.js?v=20261115_04" defer></script>
  <script src="/js/staff.js?v=20261115_04" defer></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-mark">
      <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="saucerGradStaff" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#faf6f0"/>
            <stop offset="75%" stop-color="#ecdccb"/>
            <stop offset="100%" stop-color="#d9c3ad"/>
          </radialGradient>
          <radialGradient id="cremaGradStaff" cx="45%" cy="45%" r="50%">
            <stop offset="0%" stop-color="#d49354"/>
            <stop offset="55%" stop-color="#a8622c"/>
            <stop offset="100%" stop-color="#3d1f0d"/>
          </radialGradient>
          <linearGradient id="rimGradStaff" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#eddccb"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="url(#saucerGradStaff)" stroke="#d9c3ad" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="32" fill="none" stroke="#cbb39c" stroke-width="1" opacity="0.6"/>
        <path d="M 72 44 C 85 44, 85 56, 72 56" fill="none" stroke="#e6d4c1" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="27" fill="url(#rimGradStaff)" stroke="#cbb39c" stroke-width="1"/>
        <circle cx="50" cy="50" r="23" fill="#3d1f0d"/>
        <circle cx="50" cy="50" r="22" fill="url(#cremaGradStaff)"/>
        <path d="M 50 45 C 50 45, 46 40, 43 40 C 39.5 40, 38 42.5, 38 45.5 C 38 49.5, 43 53.5, 50 58 C 57 53.5, 62 49.5, 62 45.5 C 62 42.5, 60.5 40, 57 40 C 54 40, 50 45, 50 45 Z" fill="#fff9f2" opacity="0.9"/>
      </svg>
    </span>
    <span>Cafe QR Ordering<small>Staff Dashboard</small></span>
  </a>
  <div class="header-actions">
    <span id="staffName" class="muted light-text"></span>
    <button class="btn btn-outline-light" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</button>
  </div>
</header>
<main class="page-shell wide-shell">
  <div class="page-title"><div><p class="eyebrow">ORDER PROCESSING</p><h1>Quản lý đơn hàng</h1><p class="muted">Xem món, số bàn và cập nhật trạng thái phục vụ.</p></div><button id="refreshOrders" class="btn btn-primary"><i class="fa-solid fa-arrows-rotate"></i> Làm mới đơn</button></div>
  <div class="status-legend"><span><i class="status-dot new"></i> Mới</span><span><i class="status-dot confirmed"></i> Đã xác nhận</span><span><i class="status-dot preparing"></i> Đang chuẩn bị</span><span><i class="status-dot ready"></i> Sẵn sàng</span><span><i class="status-dot completed"></i> Hoàn thành</span></div>
  <div id="ordersList" class="orders-grid"><div class="loading-card">Đang tải đơn hàng...</div></div>
</main>
<footer class="site-footer">Cafe QR Ordering Website · Staff</footer>
</body>
</html>
