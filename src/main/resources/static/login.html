<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · Cafe QR Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261116_v4">
  <script src="/js/common.js?v=20261116_v4" defer></script>
  <script src="/js/login.js?v=20261116_v4" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="back-link" href="/">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Về trang khách hàng</span>
    </a>
    <div class="login-icon">
      <img src="/images/logo.png" alt="QR Cà Phê Tây Nguyên" class="login-logo-img">
    </div>
    <p class="eyebrow center">CAFE QR ORDERING</p>
    <h1 class="center">Đăng nhập</h1>
    <p class="muted center">Dành cho Manager và Staff</p>
    <form id="loginForm" class="form-stack">
      <label class="field-label" for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" required maxlength="100" placeholder="Nhập username">
      <label class="field-label" for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu">
      <button class="btn btn-primary btn-full" type="submit" style="margin-top: 14px;"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
      <p id="loginMessage" class="form-message center" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
