<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết đơn hàng · Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261116_v4">
  <script src="/js/common.js?v=20261116_v4" defer></script>
  <script src="/js/order-detail.js?v=20261116_v4" defer></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/admin.html">
    <span class="brand-mark">
      <img src="/images/logo.png" alt="QR Cà Phê Tây Nguyên" class="brand-logo-img">
    </span>
    <span>Cafe QR Ordering<small>Admin Dashboard</small></span>
  </a>
  <div class="header-actions">
    <span class="user-pill"><i class="fa-solid fa-user-tie"></i> <span id="adminName">Admin</span></span>
    <button class="btn btn-outline-light" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</button>
  </div>
</header>

<!-- THANH MENU ĐIỀU HƯỚNG CHÍNH -->
<nav class="admin-navbar">
  <div class="admin-nav-menu">
    <a href="/admin.html" class="nav-link"><i class="fa-solid fa-cubes"></i> Đơn hàng & Bàn</a>
    <a href="/history.html" class="nav-link active"><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đơn</a>
    <a href="/menu-manage.html" class="nav-link"><i class="fa-solid fa-utensils"></i> Thực đơn món</a>
    <a href="/toppings.html" class="nav-link"><i class="fa-solid fa-layer-group"></i> Quản lý Topping</a>
    <a href="/staff-manage.html" class="nav-link"><i class="fa-solid fa-users-gear"></i> Tài khoản Staff</a>
  </div>
</nav>

<main class="page-shell wide-shell">
  <div class="order-detail-shell">
    <div class="order-detail-nav no-print">
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <a href="/history.html" class="btn btn-secondary btn-small">
          <i class="fa-solid fa-arrow-left"></i> Quay lại lịch sử đơn
        </a>
        <a href="/admin.html" class="btn btn-outline btn-small">
          <i class="fa-solid fa-cubes"></i> Đơn hàng trực tiếp
        </a>
      </div>
      <div>
        <button type="button" class="btn btn-primary btn-small" onclick="window.print()">
          <i class="fa-solid fa-print"></i> In hóa đơn
        </button>
      </div>
    </div>

    <!-- KHUNG HIỂN THỊ CHI TIẾT ĐƠN HÀNG VÀ HÓA ĐƠN -->
    <div id="orderDetailContainer">
      <div class="loading-card" style="padding: 40px; text-align: center;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 28px; margin-bottom: 12px; color: var(--coffee-primary);"></i>
        <p class="muted">Đang tải chi tiết đơn hàng...</p>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer no-print">Cafe QR Ordering Website · Chi tiết đơn hàng</footer>

<!-- NÚT CUỘN LÊN ĐẦU TRANG -->
<button type="button" id="backToTopBtn" class="back-to-top-btn" title="Cuộn lên đầu trang" aria-label="Lên đầu trang">
  <i class="fa-solid fa-arrow-up"></i>
</button>
</body>
</html>
